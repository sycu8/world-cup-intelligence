# GitHub Actions deploy — token ONLY in repo Secrets (Settings → Secrets → Actions)
# Name: CLOUDFLARE_API_TOKEN
# A push to main deploys only after the CI workflow succeeds for that commit.
# workflow_run reads this file from the default branch, so the gate starts once this lands on main.
name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        default: both
        type: choice
        options:
          - uat
          - production
          - both
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require CI success for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.sha }}"
          branch="${{ github.ref_name }}"
          for attempt in $(seq 1 40); do
            conclusion=$(gh run list --workflow=ci.yml --commit "$sha" --limit 20 \
              --json conclusion,event,headBranch \
              --jq '[.[] | select(.headBranch=="'"$branch"'" and (.event=="push" or .event=="pull_request"))][0].conclusion // ""')
            echo "CI conclusion for $sha: ${conclusion:-pending}"
            if [ "$conclusion" = "success" ]; then
              exit 0
            fi
            if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ]; then
              echo "CI $conclusion for $sha"
              exit 1
            fi
            sleep 30
          done
          echo "CI did not pass for $sha"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=both" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: npm ci

      - name: Security audit
        run: npm run audit

      - name: Apply D1 migrations (UAT)
        if: steps.target.outputs.value == 'uat' || steps.target.outputs.value == 'both'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:uat

      # UAT is only on the Access hostname wcstat-uat.orangecloud.vn.
      # workers_dev and preview_urls are false; do not call *.workers.dev.
      - name: Deploy UAT
        if: steps.target.outputs.value == 'uat' || steps.target.outputs.value == 'both'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:uat

      - name: Apply D1 migrations (Production)
        if: steps.target.outputs.value == 'production' || steps.target.outputs.value == 'both'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:production

      - name: Deploy Production
        if: steps.target.outputs.value == 'production' || steps.target.outputs.value == 'both'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:production
